services:
  database:
    image: supabase/postgres:15.14.1.053
    container_name: article_database
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "article"
    volumes:
      - database_data:/var/lib/postgresql/data

volumes:
  database_data:

